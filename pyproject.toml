[project]
name = "postgres-reasoning-platform-demo"
version = "0.1.0"
description = "A portfolio-grade PostgreSQL backend demo for deterministic, auditable reasoning workflows."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.110.0",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.27",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
