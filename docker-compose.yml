services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: reasoning
      POSTGRES_USER: reasoning
      POSTGRES_PASSWORD: reasoning
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reasoning -d reasoning"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
